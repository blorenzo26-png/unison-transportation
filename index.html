<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Montserrat', 'sans-serif'] },
        colors: {
          obsidian:   '#0A0A0A',
          gold:       '#D4AF37',
          champagne:  '#F5E6D3',
          charcoal:   '#2C2C2C',
          twilight:   '#4A4A6A',
          neonred:    '#E63946',
          sage:       '#606C38',
          amber:      '#FFB703',
          ryman:      '#6F4E37',
          platinum:   '#E5E4E2',
        },
      },
    },
  };
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body { background-color: #0A0A0A; }
  body {
    font-family: 'Montserrat', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    color: #FFFFFF;
    margin: 0;
    overflow-x: hidden;
  }

  /* Placeholder for the cinematic video the user will drop in later.
     Subtle radial + linear ambience in the brand palette, plus faint
     film-grain so the hero never feels empty while the asset is missing. */
  .video-placeholder {
    position: absolute;
    inset: 0;
    background-color: #0A0A0A;
    background-image:
      radial-gradient(ellipse 80% 60% at 72% 30%, rgba(212,175,55,0.18) 0%, rgba(212,175,55,0) 55%),
      radial-gradient(ellipse 70% 55% at 20% 85%, rgba(74,74,106,0.45) 0%, rgba(74,74,106,0) 60%),
      radial-gradient(ellipse 40% 30% at 85% 92%, rgba(255,183,3,0.10) 0%, rgba(255,183,3,0) 70%),
      linear-gradient(180deg, #0A0A0A 0%, #111114 55%, #0A0A0A 100%);
    overflow: hidden;
  }
  .video-placeholder::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.015) 0px,
        rgba(255,255,255,0.015) 1px,
        transparent 1px,
        transparent 3px
      );
    mix-blend-mode: overlay;
    pointer-events: none;
  }
  .video-placeholder-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: rgba(245, 230, 211, 0.35);
    text-transform: uppercase;
    text-align: center;
    line-height: 1.8;
    pointer-events: none;
  }

  /* Liquid glass — tuned for the obsidian + gold palette */
  .liquid-glass {
    background: rgba(10, 10, 10, 0.42);
    background-blend-mode: luminosity;
    backdrop-filter: blur(14px) saturate(120%);
    -webkit-backdrop-filter: blur(14px) saturate(120%);
    border: none;
    box-shadow:
      inset 0 1px 1px rgba(245, 230, 211, 0.10),
      0 10px 40px -10px rgba(0, 0, 0, 0.5);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(180deg,
      rgba(212,175,55,0.35) 0%,
      rgba(245,230,211,0.10) 20%,
      rgba(255,255,255,0)   40%,
      rgba(255,255,255,0)   60%,
      rgba(245,230,211,0.10) 80%,
      rgba(212,175,55,0.35) 100%);
    -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }

  /* Gold hairline for the primary CTA */
  .cta-primary {
    background: #F5E6D3;
    color: #0A0A0A;
    transition: background 300ms ease, transform 300ms ease, box-shadow 300ms ease;
    box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 10px 30px -10px rgba(212,175,55,0.35);
  }
  .cta-primary:hover {
    background: #FFFFFF;
    box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 14px 40px -10px rgba(212,175,55,0.55);
  }

  .cta-secondary {
    color: #FFFFFF;
    transition: background 300ms ease, color 300ms ease;
  }
  .cta-secondary:hover {
    background: rgba(245,230,211,0.95);
    color: #0A0A0A;
  }

  .nav-link {
    transition: color 300ms ease, letter-spacing 300ms ease;
  }
  .nav-link:hover { color: #D4AF37; }

  /* A faint vignette that anchors copy at the bottom */
  .hero-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(10,10,10,0) 40%, rgba(10,10,10,0.55) 100%);
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { useEffect, useState } = React;

    /* ---------- Text-animation gate ----------
       The hero copy should start cascading in 3 seconds after the video
       begins playing. HeroVideo broadcasts the moment, and the text
       components (FadeIn / AnimatedHeading) use their existing `delay` props
       as relative offsets from that moment. Fallback: if the video never
       fires `playing` (network issue, codec hiccup) we release after 5 s so
       the copy never stays hidden. */
    const TEXT_GATE_EVENT = 'hero:text-gate';
    const TEXT_GATE_OFFSET_MS = 3000;
    const getTextGateAt = () => window.__heroTextGateAt || 0;
    const useTextGateReady = (extraDelay = 0) => {
      const [ready, setReady] = useState(false);
      useEffect(() => {
        let t = null;
        const arm = () => {
          if (t) clearTimeout(t);
          t = setTimeout(() => setReady(true), extraDelay);
        };
        if (getTextGateAt()) {
          arm();
        } else {
          const onGate = () => arm();
          window.addEventListener(TEXT_GATE_EVENT, onGate, { once: true });
          return () => {
            window.removeEventListener(TEXT_GATE_EVENT, onGate);
            if (t) clearTimeout(t);
          };
        }
        return () => { if (t) clearTimeout(t); };
      }, [extraDelay]);
      return ready;
    };

    /* ---------- HeroVideo ----------
       The preview serves the parent HTML with an auth token in its query string,
       but video elements don't forward that token on relative subresource requests
       (only fetch() inherits the page's credentials). So: fetch as a blob and hand
       a blob URL to <video>. Works in both authed-preview and standalone contexts. */
    function HeroVideo({ src }) {
      const [blobUrl, setBlobUrl] = useState(null);
      useEffect(() => {
        let cancelled = false;
        let created = null;

        // Forward the current page's `?t=...` auth token to the asset URL if present.
        const tokenMatch = location.search.match(/[?&]t=([^&]+)/);
        const url = tokenMatch ? `${src}?t=${tokenMatch[1]}` : src;

        fetch(url)
          .then(r => r.ok ? r.blob() : Promise.reject(new Error(`HTTP ${r.status}`)))
          .then(b => {
            if (cancelled) return;
            created = URL.createObjectURL(b);
            setBlobUrl(created);
          })
          .catch(() => {
            // Fall back to direct src — works when served without auth.
            if (!cancelled) setBlobUrl(src);
          });

        return () => {
          cancelled = true;
          if (created) URL.revokeObjectURL(created);
        };
      }, [src]);

      const fireGate = () => {
        if (window.__heroTextGateAt) return;
        window.__heroTextGateAt = performance.now();
        window.dispatchEvent(new CustomEvent(TEXT_GATE_EVENT));
      };

      // Arm the gate 3 s after the video actually begins playing.
      const handlePlaying = () => {
        if (window.__heroTextGateArmed) return;
        window.__heroTextGateArmed = true;
        setTimeout(fireGate, TEXT_GATE_OFFSET_MS);
      };

      // Safety net: if the video never reports `playing` (blocked autoplay,
      // codec failure), release the text after 5 s so the hero isn't blank.
      useEffect(() => {
        const fallback = setTimeout(fireGate, 5000);
        return () => clearTimeout(fallback);
      }, []);

      return (
        <video
          className="absolute inset-0 w-full h-full object-cover"
          src={blobUrl || undefined}
          autoPlay
          muted
          playsInline
          onPlaying={handlePlaying}
          aria-hidden="true"
        />
      );
    }

    /* ---------- FadeIn ---------- */
    function FadeIn({ delay = 0, duration = 1000, children, className = '', style = {} }) {
      const visible = useTextGateReady(delay);
      return (
        <div
          className={`transition-opacity ${className}`}
          style={{
            opacity: visible ? 1 : 0,
            transitionDuration: `${duration}ms`,
            ...style,
          }}
        >
          {children}
        </div>
      );
    }

    /* ---------- AnimatedHeading ---------- */
    function AnimatedHeading({ text, className = '', style = {}, charDelay = 30, initialDelay = 200 }) {
      const started = useTextGateReady(initialDelay);

      const lines = text.split('\n');

      return (
        <h1 className={className} style={style}>
          {lines.map((line, lineIndex) => (
            <span key={lineIndex} style={{ display: 'block' }}>
              {Array.from(line).map((ch, charIndex) => {
                const d = (lineIndex * line.length * charDelay) + (charIndex * charDelay);
                return (
                  <span
                    key={charIndex}
                    style={{
                      display: 'inline-block',
                      opacity: started ? 1 : 0,
                      transform: started ? 'translateX(0)' : 'translateX(-18px)',
                      transition: `opacity 500ms ease ${d}ms, transform 500ms ease ${d}ms`,
                      whiteSpace: 'pre',
                    }}
                  >
                    {ch === ' ' ? '\u00A0' : ch}
                  </span>
                );
              })}
            </span>
          ))}
        </h1>
      );
    }

    /* ---------- Navbar ---------- */
    function Navbar() {
      return (
        <div className="px-6 md:px-12 lg:px-16 pt-6 relative z-20">
          <nav className="liquid-glass rounded-xl px-4 py-2 flex items-center justify-between">
            {/* Left: wordmark */}
            <a href="#" className="flex items-center gap-3 select-none">
              <span
                className="text-2xl font-semibold tracking-tight text-white"
                style={{ letterSpacing: '-0.02em' }}
              >
                UNISON
              </span>
              <span
                className="hidden sm:inline-block text-[10px] font-light text-champagne/70 tracking-[0.28em] border-l border-white/15 pl-3"
              >
                TRANSPORTATION
              </span>
            </a>

            {/* Center: nav links */}
            <div className="hidden md:flex items-center gap-8 text-sm text-white/85">
              <a href="#" className="nav-link">Fleet</a>
              <a href="#" className="nav-link">Experience</a>
              <a href="#" className="nav-link">Nashville</a>
              <a href="#" className="nav-link">Concierge</a>
            </div>

            {/* Right: CTA */}
            <a
              href="#"
              className="cta-primary px-6 py-2 rounded-lg text-sm font-medium"
            >
              Reserve
            </a>
          </nav>
        </div>
      );
    }

    /* ---------- Hero ---------- */
    function Hero() {
      return (
        <section className="relative w-full h-screen min-h-[760px] overflow-hidden text-white">
          {/* Background video — loaded as a blob so the preview's auth token is applied via fetch. */}
          <HeroVideo src="hero-loop.mp4" />

          {/* Soft bottom vignette only (no dimming overlay) */}
          <div className="hero-vignette" aria-hidden="true" />

          {/* Foreground */}
          <div className="relative z-10 flex flex-col h-full">
            <Navbar />

            {/* Content */}
            <div className="px-6 md:px-12 lg:px-16 flex-1 flex flex-col justify-end pb-12 lg:pb-16">
              <div className="lg:grid lg:grid-cols-2 lg:items-end lg:gap-10">

                {/* Left */}
                <div>
                  <AnimatedHeading
                    text={"Private luxury,\nNashville to anywhere."}
                    className="text-4xl md:text-5xl lg:text-6xl xl:text-7xl font-normal mb-4 text-white"
                    style={{ letterSpacing: '-0.04em', lineHeight: 1.02 }}
                  />

                  <FadeIn delay={800} duration={1000}>
                    <p className="text-base md:text-lg text-champagne/80 mb-6 max-w-xl font-light">
                      A Mercedes-Maybach Sprinter fleet, a private concierge,
                      and the city's most discreet chauffeurs — built for nights
                      that deserve more than a ride.
                    </p>
                  </FadeIn>

                  <FadeIn delay={1200} duration={1000}>
                    <div className="flex flex-wrap gap-4">
                      <a
                        href="#"
                        className="cta-primary px-8 py-3 rounded-lg font-medium text-sm tracking-wide"
                      >
                        Reserve the Maybach
                      </a>
                      <a
                        href="#"
                        className="cta-secondary liquid-glass border border-white/15 px-8 py-3 rounded-lg font-medium text-sm tracking-wide"
                      >
                        Explore the Fleet
                      </a>
                    </div>
                  </FadeIn>
                </div>

                {/* Right — glass tag */}
                <div className="flex items-end justify-start lg:justify-end mt-10 lg:mt-0">
                  <FadeIn delay={1400} duration={1000}>
                    <div className="liquid-glass px-6 py-3 rounded-xl">
                      <div className="flex items-center gap-4">
                        <span className="w-1.5 h-1.5 rounded-full bg-gold shadow-[0_0_10px_2px_rgba(212,175,55,0.6)]"></span>
                        <span className="text-lg md:text-xl lg:text-2xl font-light text-white tracking-wide">
                          Chauffeur<span className="text-champagne/50 mx-2">·</span>Concierge<span className="text-champagne/50 mx-2">·</span>Maybach
                        </span>
                      </div>
                    </div>
                  </FadeIn>
                </div>

              </div>

              {/* Footer strip */}
              <FadeIn delay={1600} duration={1000}>
                <div className="mt-10 pt-6 border-t border-white/10 flex flex-wrap items-center justify-between gap-4 text-[11px] tracking-[0.28em] uppercase text-champagne/50 font-light">
                  <span>Est. Nashville · Tennessee</span>
                  <span className="hidden md:inline-block">Mercedes-Maybach Sprinter Fleet</span>
                  <span>24 / 7 Concierge · +1 615 000 0000</span>
                </div>
              </FadeIn>
            </div>
          </div>
        </section>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Hero />);
  </script>
</body>
</html>
